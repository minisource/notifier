name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
    tags: ["v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version: "1.24"
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Check formatting
        run: |
          if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
            gofmt -s -l .
            exit 1
          fi
        env:
          GOFLAGS: -mod=mod

      - name: Verify modules
        run: go mod verify
        env:
          GOFLAGS: -mod=mod

      - name: Vet
        run: go vet ./...
        env:
          GOFLAGS: -mod=mod

      - name: Test
        run: go test -race -count=1 -timeout 300s ./...
        env:
          GOFLAGS: -mod=mod

      - name: Build
        run: go build ./...
        env:
          GOFLAGS: -mod=mod

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@499170d96c583f6812e20f444f95c6e587bd3b21 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Install dependencies
        working-directory: front
        run: npm ci --legacy-peer-deps

      - name: Lint
        working-directory: front
        run: npm run lint

      - name: Type check
        working-directory: front
        run: npm run type-check

      - name: Test
        working-directory: front
        run: npm run test -- --run

      - name: Build
        working-directory: front
        run: npm run build

  docker-backend:
    name: Docker Backend
    needs: backend
    uses: minisource/.github/.github/workflows/build-and-push.yml@main
    with:
      image-name: minisource/notifier-backend
      dockerfile-path: backend/Dockerfile
      build-context: .
      default-branch: master
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  docker-frontend:
    name: Docker Frontend
    needs: frontend
    uses: minisource/.github/.github/workflows/build-and-push.yml@main
    with:
      image-name: minisource/notifier-frontend
      dockerfile-path: front/Dockerfile
      build-context: .
      default-branch: master
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
