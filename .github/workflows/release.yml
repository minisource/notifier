name: Docker Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  backend-validate:
    name: Backend Validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version: "1.24"
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 -timeout 300s ./...

      - name: Build
        run: go build ./...

  docker-backend:
    name: Docker Publish Backend
    needs: backend-validate
    uses: minisource/.github/.github/workflows/docker-release.yml@main
    with:
      image-name: ${{ secrets.DOCKERHUB_USERNAME }}/notifier-backend
      dockerfile-path: backend/Dockerfile
      build-context: .
      default-branch: master
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  # Frontend Docker release blocked until Phase 7 (design-system npm publish)
  docker-frontend:
    name: Docker Publish Frontend
    needs: backend-validate
    runs-on: ubuntu-latest
    if: false  # BLOCKED — design-system not on npm yet
    uses: minisource/.github/.github/workflows/docker-release.yml@main
    with:
      image-name: ${{ secrets.DOCKERHUB_USERNAME }}/notifier-frontend
      dockerfile-path: front/Dockerfile
      build-context: .
      default-branch: master
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
